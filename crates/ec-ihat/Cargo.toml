[package]
name = "ec-ihat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "EC-IHAT: an issuer-hiding anonymous token over NIST P-256, per draft-authors-mole-ec-ihat"
repository.workspace = true
keywords = ["anonymous-tokens", "privacy", "blind-signatures", "zero-knowledge", "p256"]
categories = ["cryptography", "no-std"]
# Examples are listed below; others in `examples/` are not built.
autoexamples = false

[features]
default = ["rustcrypto", "std"]
# The backend features select those of `mole-p256`.
# Pure-Rust backend on the RustCrypto `p256` stack.
rustcrypto = ["mole-p256/rustcrypto"]
# Standard library support; with `rustcrypto`, also enables the
# precomputed generator tables of `p256`.
std = ["mole-p256/std"]
# Randomness from the JavaScript host on `wasm32-unknown-unknown`, for the
# `rustcrypto` backend; other bare targets need a `getrandom` custom backend.
wasm_js = ["mole-p256/wasm_js"]
# BoringSSL backend over the `bssl-sys` FFI bindings. `bssl-sys` is not
# published; patch it to a BoringSSL checkout (see README).
boringssl = ["mole-p256/boringssl"]

[dependencies]
mole-p256 = { path = "../mole-p256", version = "0.1.0", default-features = false }
subtle.workspace = true
zeroize.workspace = true

[dev-dependencies]
hex.workspace = true
criterion.workspace = true

[package.metadata.docs.rs]
features = ["rustcrypto"]

[[example]]
name = "ihat_demo"
path = "examples/demo.rs"

[[bench]]
name = "ec_ihat"
harness = false
