[package]
name = "rollatini-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "Rollatini: an issuer-hiding anonymous token over NIST P-256, per draft-authors-mole-rollatini"
repository = "https://github.com/Moderation-of-unLinkable-Endorsements/anchor-token-rs"
keywords = ["anonymous-tokens", "privacy", "blind-signatures", "zero-knowledge", "p256"]
categories = ["cryptography", "no-std"]
# Examples are listed below; others in `examples/` are not built.
autoexamples = false

[lib]
name = "rollatini"

[features]
default = ["rustcrypto", "std"]
# Pure-Rust backend on the RustCrypto `p256` stack.
rustcrypto = ["dep:p256", "dep:sha2", "dep:getrandom"]
# Standard library support; with `rustcrypto`, also enables the
# precomputed generator tables of `p256`.
std = ["p256?/std", "p256?/precomputed-tables", "getrandom?/std"]
# Randomness from the JavaScript host on `wasm32-unknown-unknown`, for the
# `rustcrypto` backend; other bare targets need a `getrandom` custom backend.
wasm_js = ["getrandom?/wasm_js"]
# BoringSSL backend over the `bssl-sys` FFI bindings. `bssl-sys` is not
# published; patch it to a BoringSSL checkout (see README).
boringssl = ["dep:bssl-sys"]

[dependencies]
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.7", default-features = false, features = ["alloc"] }

p256 = { version = "0.14", default-features = false, features = ["arithmetic", "hash2curve", "alloc"], optional = true }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"], optional = true }
getrandom = { version = "0.4", optional = true }

bssl-sys = { version = "0.1.0", optional = true }

[dev-dependencies]
hex = "0.4"

[package.metadata.docs.rs]
features = ["rustcrypto"]

[dev-dependencies.criterion]
version = "0.8"

[[example]]
name = "demo"

[[bench]]
name = "rollatini"
harness = false
