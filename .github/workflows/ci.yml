name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    name: Test, lint, docs (RustCrypto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps
      - run: cargo run --example demo

  features:
    name: Feature powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      # `boringssl` needs a BoringSSL build; the `boringssl` job covers it.
      - run: cargo hack check --feature-powerset --features rustcrypto --exclude-features boringssl --all-targets

  msrv:
    name: Minimum supported Rust (library)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      # Dev-dependencies need a newer toolchain; the library itself builds here.
      - run: cargo check --lib

  targets:
    name: Other targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target i686-unknown-linux-gnu
      - run: cargo check --target wasm32-unknown-unknown --features wasm_js
      - run: cargo check --no-default-features --features rustcrypto

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-machete
      - run: cargo machete
      - uses: EmbarkStudios/cargo-deny-action@v2

  boringssl:
    name: Test, lint (BoringSSL and both backends)
    runs-on: ubuntu-latest
    env:
      BORINGSSL_BUILD_DIR: ${{ github.workspace }}/boringssl/build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - uses: taiki-e/install-action@v2
        with:
          tool: bindgen-cli
      - name: Cache the BoringSSL build
        id: boringssl-cache
        uses: actions/cache@v4
        with:
          path: boringssl
          key: boringssl-${{ runner.os }}-${{ hashFiles('scripts/build-boringssl.sh') }}
      - if: steps.boringssl-cache.outputs.cache-hit != 'true'
        run: scripts/build-boringssl.sh
      - run: cargo test --no-default-features --features boringssl --config boringssl/cargo-config.toml
      - run: cargo test --features rustcrypto,boringssl --config boringssl/cargo-config.toml
      - run: cargo clippy --all-targets --features rustcrypto,boringssl --config boringssl/cargo-config.toml -- -D warnings

  mutants:
    name: Mutation testing (changed lines)
    runs-on: ubuntu-latest
    env:
      # Mutants often leave a binding unused; denying warnings would discard
      # them as unviable instead of testing them.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-mutants
      - uses: Swatinem/rust-cache@v2
      - run: git diff "$BASE" HEAD > "$RUNNER_TEMP/change.diff"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      # Fails if any viable mutant of a changed line survives the test suite,
      # apart from the exclusions in .cargo/mutants.toml.
      - run: cargo mutants --in-diff "$RUNNER_TEMP/change.diff" -j 2 --timeout 300
