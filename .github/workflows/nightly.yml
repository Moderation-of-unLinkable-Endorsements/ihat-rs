name: Deep checks

# Slower checks that do not need to run on every commit: Miri over the
# pure-Rust paths, mutation testing of the proof, permutation, and encoding
# modules, and coverage.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  miri:
    name: Miri (pure-Rust primitives)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # SHA-256 is forced to its portable implementation: the hardware
      # intrinsics use loads Miri cannot model. The FFI backend cannot run
      # at all.
      - run: >
          cargo miri test --lib --
          rustcrypto::point_arithmetic rustcrypto::derivations primitives::depths
          rustcrypto::expand_message_xmd_vectors rustcrypto::hash_to_curve_vectors
        env:
          RUSTFLAGS: --cfg sha2_backend="soft"
          MIRIFLAGS: -Zmiri-disable-isolation

  mutants:
    name: Mutation testing (proofs, permutation, and encodings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-mutants
      - uses: Swatinem/rust-cache@v2
      # Fails if any viable mutant survives the test suite.
      - run: cargo mutants -f src/protocol.rs -f src/commitment.rs -f src/permutation.rs -f src/hash.rs -f src/wire.rs -j 2 --timeout 300

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --lib --summary-only
